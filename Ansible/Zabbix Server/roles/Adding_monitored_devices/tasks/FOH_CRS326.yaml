- name: Add FOH CRS326-24G-2S+RM to Zabbix
  vars:
    ansible_network_os: community.zabbix.zabbix
    ansible_connection: httpapi
    ansible_httpapi_port: "{{ zabbix_api_port }}"
    ansible_httpapi_use_ssl: true
    ansible_httpapi_validate_certs: false
    ansible_zabbix_url_path: "{{ zabbix_url_path }}"
    ansible_host: "{{ zabbix_api_host }}"
    ansible_user: "{{ zabbix_web_username | default('Admin') }}"
    ansible_httpapi_pass: "{{ zabbix_web_password | default('zabbix') }}"

  become: false
  community.zabbix.zabbix_host:
    host_name: "FOH CRS326"
    visible_name: "FOH CRS326"
    description: "MikroTik CRS326-24G-2S+RM FOH Switch"
    host_groups:
      - Networking
      - Switch
    link_templates:
      - MikroTik CRS326-24G-2SRM by SNMP
      # - MikroTik by SNMP - Traps

    status: enabled
    state: present
    interfaces:
      - type: snmp
        main: true
        useip: true
        ip: "10.69.10.151"
        dns: "switch-foh"
        port: "161"
        details:
          version: 2
          bulk: 1
          community: "public"