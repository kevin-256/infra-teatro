    records:
      - name: router
        type: A
        address: 10.69.40.254
      - name: ntp
        type: A
        address: 10.69.40.254
      - name: companion
        type: A
        address: 10.69.10.251
      - name: centralino
        type: A
        address: 10.69.10.249
  - name: ccpm_artnet
    domain: ccpm
    view: artnet
    file: db.ccpm.artnet
