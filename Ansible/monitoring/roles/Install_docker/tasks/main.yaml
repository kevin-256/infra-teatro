- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present
    update_cache: true
- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
